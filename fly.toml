# Senator Map — Fly.io deployment.
#
# Fly requires a payment method on file before an app can be created. The card
# is only verified (a small pre-authorization is placed and immediately
# cancelled); on a free-tier workload nothing is actually charged.
#
# No volume is needed: the database is remote (Turso) and uploaded workbooks
# are disposable, so this config no longer carries any mounts.
#
#   fly apps create senator-map-denyut
#   fly secrets set TURSO_DATABASE_URL=libsql://... TURSO_AUTH_TOKEN=...
#   fly deploy
#
# Never run `fly launch` here: it rewrites this file.
#
# Note on cost: auto_stop_machines below stops the Machine when idle, which
# keeps usage near zero but means the first request after a quiet period waits
# for a cold boot. Set min_machines_running = 1 for an always-on app.

app = "senator-map-denyut"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  UPLOAD_DIR = "/tmp/uploads"
  NODE_OPTIONS = "--max-old-space-size=384"
  # TURSO_DATABASE_URL and TURSO_AUTH_TOKEN must be set separately, because
  # secrets do not belong in a committed file:
  #   fly secrets set TURSO_DATABASE_URL=libsql://... TURSO_AUTH_TOKEN=...

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/api/admin/status"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

kill_signal = "SIGINT"
kill_timeout = "30s"
