# Fly.io configuration for Senator Map — REQUIRES A CREDIT CARD.
#
# Fly removed its no-card free tier: new organisations must add a payment
# method before an app can be created, and the free trial is limited to
# 2 VM hours or 7 days. If you have no card, use render.yaml instead — it
# deploys the same stateless app on Render's free tier with no payment info.
#
# If you do add a card, this config works as-is and needs no volume at all,
# because the database is remote (Turso) and uploads are disposable.
#
#   fly apps create senator-map-denyut
#   fly deploy
#
# Never run `fly launch` here: it rewrites this file.

app = "senator-map-denyut"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  UPLOAD_DIR = "/tmp/uploads"
  NODE_OPTIONS = "--max-old-space-size=384"
  # TURSO_DATABASE_URL and TURSO_AUTH_TOKEN must be set separately, because
  # secrets do not belong in a committed file:
  #   fly secrets set TURSO_DATABASE_URL=libsql://... TURSO_AUTH_TOKEN=...

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/api/admin/status"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

kill_signal = "SIGINT"
kill_timeout = "30s"
